<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Phuebus — The Interactive Visual Engine for Live Stage & Events. Connect your camera, control your visuals.">
  <title>Phuebus — Visual Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .hero { max-width: 520px; width: 100%; }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 480px;
    }

    .mode-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 24px 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: border-color var(--duration-base) ease, background var(--duration-base) ease, transform var(--duration-fast) ease;
      text-decoration: none;
      color: inherit;
      touch-action: none;
    }
    .mode-card:hover {
      border-color: var(--border-bright);
      background: var(--bg-elevated);
    }
    .mode-card:active { transform: scale(0.98); }

    .mode-icon {
      font-size: 2rem;
      line-height: 1;
      margin-bottom: 4px;
    }
    .mode-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .mode-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .mode-card.display-card { border-color: rgba(34, 211, 238, 0.2); }
    .mode-card.display-card:hover { border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(34, 211, 238, 0.1); }
    .mode-card.remote-card  { border-color: rgba(244, 114, 182, 0.2); }
    .mode-card.remote-card:hover  { border-color: var(--neon-pink); box-shadow: 0 0 20px rgba(244, 114, 182, 0.1); }

    .session-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 480px;
    }
    .session-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .session-actions {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 320px;
    }

    .divider {
      width: 1px;
      height: 40px;
      background: var(--border);
      margin: 0 8px;
    }

    .tagline {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    #newCodeBtn { flex-shrink: 0; }

    #status-indicator {
      position: fixed;
      bottom: var(--space-md);
      right: var(--space-md);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg-overlay);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="page-center">

    <!-- Logo -->
    <div class="hero animate-in">
      <div class="logo">Phuebus</div>
      <div class="logo-sub">Interactive Visual Engine</div>
    </div>

    <p class="tagline animate-in animate-in-delay-1">
      Live stage visuals — shader-powered, audio-reactive, mobile-controlled.
    </p>

    <!-- Session code -->
    <div class="session-section animate-in animate-in-delay-2">
      <span class="session-label">Session Code</span>
      <div id="codeDisplay" class="session-code">----</div>
      <div class="session-actions">
        <button id="copyBtn" class="btn btn-ghost btn-sm" style="flex:1">Copy URL</button>
        <button id="newCodeBtn" class="btn btn-ghost btn-sm" title="Generate new code">↻ New</button>
      </div>
    </div>

    <!-- Mode selector -->
    <div class="mode-grid animate-in animate-in-delay-3">
      <a id="displayLink" href="/display" class="mode-card display-card">
        <div class="mode-icon">🖥️</div>
        <div class="mode-title">Display</div>
        <div class="mode-desc">Projector output + shader control</div>
      </a>
      <a id="remoteLink" href="/remote" class="mode-card remote-card">
        <div class="mode-icon">📱</div>
        <div class="mode-title">Remote</div>
        <div class="mode-desc">Camera streamer + touch controls</div>
      </a>
    </div>

  </div>

  <!-- Server connection indicator -->
  <div id="status-indicator">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Connecting…</span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({ transports: ['websocket'] });

    const codeDisplay = document.getElementById('codeDisplay');
    const displayLink = document.getElementById('displayLink');
    const remoteLink  = document.getElementById('remoteLink');
    const copyBtn     = document.getElementById('copyBtn');
    const newCodeBtn  = document.getElementById('newCodeBtn');
    const statusDot   = document.getElementById('statusDot');
    const statusText  = document.getElementById('statusText');

    let currentCode = null;
    let currentRemoteUrl = null;

    // ── Load session from server ─────────────────────────────────────────────
    async function loadSession(endpoint = '/api/session') {
      const res  = await fetch(endpoint);
      const data = await res.json();
      applySession(data);
    }

    function applySession({ roomCode, remoteUrl, displayUrl }) {
      currentCode      = roomCode;
      currentRemoteUrl = remoteUrl;

      codeDisplay.textContent = roomCode;

      // Pre-fill links with code
      displayLink.href = `/display?code=${roomCode}`;
      remoteLink.href  = `/remote?code=${roomCode}`;
    }

    // ── Button handlers ──────────────────────────────────────────────────────
    copyBtn.addEventListener('pointerdown', async () => {
      if (!currentRemoteUrl) return;
      try {
        await navigator.clipboard.writeText(currentRemoteUrl);
        const orig = copyBtn.textContent;
        copyBtn.textContent = '✓ Copied';
        setTimeout(() => { copyBtn.textContent = orig; }, 1800);
      } catch {
        copyBtn.textContent = currentRemoteUrl; // fallback — show URL
      }
    });

    newCodeBtn.addEventListener('pointerdown', async () => {
      newCodeBtn.disabled = true;
      newCodeBtn.textContent = '…';
      await loadSession('/api/session/new');
      newCodeBtn.disabled = false;
      newCodeBtn.textContent = '↻ New';
    });

    // ── Socket status ─────────────────────────────────────────────────────────
    socket.on('connect', () => {
      statusDot.className = 'dot connected';
      statusText.textContent = 'Server connected';
    });
    socket.on('disconnect', () => {
      statusDot.className = 'dot error';
      statusText.textContent = 'Disconnected';
    });

    // ── Init ─────────────────────────────────────────────────────────────────
    loadSession();
  </script>
</body>
</html>
